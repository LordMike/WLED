name: LordMike Release CI

on:
  push:
    tags:
      - '*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  wled_build:
    uses: ./.github/workflows/build.yml
    with:
      release: true
      release_config: .github/platformio_lordmike_release.ini.template

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: wled_build
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        path: src
    - name: Generate release notes
      working-directory: src
      run: |
        git fetch --no-tags https://github.com/wled/WLED.git \
          '+refs/heads/16_x:refs/remotes/upstream/16_x' \
          '+refs/heads/main:refs/remotes/upstream/main'
        .github/scripts/lordmike-release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
        cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/download-artifact@v4
      with:
        merge-multiple: true
    - name: Create draft release
      uses: softprops/action-gh-release@v1
      with:
        body_path: ${{ runner.temp }}/release-notes.md
        draft: true
        files: |
          *.bin
          *.bin.gz
